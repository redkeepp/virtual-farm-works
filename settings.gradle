// Virtual Farm Works — Gradle settings: plugin repositories and the Java toolchain resolver (downloads JDK 25 when the
// machine does not have one). Unchanged from the NeoForge MDK.
pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
