# Virtual Farm Works — mod metadata TEMPLATE. Gradle (generateModMetadata in build.gradle) replaces every
# dollar-brace placeholder with the values from gradle.properties and puts the result in the jar as
# META-INF/neoforge.mods.toml. Edit versions, names and links in gradle.properties, not here.
# WARNING: this file is a Groovy template. Never write a literal dollar sign followed by a brace, even in a comment:
# Gradle tries to evaluate it and the build fails. Lines between percent-sign tags are Groovy too (optional lines).
# Format: https://docs.neoforged.net/docs/gettingstarted/modfiles

license="${mod_license}"
# Shown when problems occur (crash screens, the mods list); left out while mod_issues_url is empty.
<% if (mod_issues_url) { %>issueTrackerURL="${mod_issues_url}"<% } %>

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# The mod's home page, shown in the mods list; left out while mod_url is empty.
<% if (mod_url) { %>displayURL="${mod_url}"<% } %>
authors="${mod_authors}"
# The owner's logo goes here once drawn: a square PNG at the root of src/main/resources, then
# logoFile="virtualfarmworks.png" (the mods list shows it).
description='''
Compact, server-friendly virtual farming. Each Farm Matrix grows up to thousands of plants inside one block on a
single shared growth cycle, so large farms cost almost nothing in server tick time. Works with vanilla and modded
plantables (crops, trees, flowers and more), with optional support for Mystical Agriculture, JEI and Jade.

Starter Farm Matrix: an early machine for one plant. Entropic Farm Matrix: 60 plant groups, powered by FE, with pipe
input, replanting and a built-in autocrafter.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations: the mod runs without them. When one is installed it must be at least the version VFW was
# built and tested against (an older one may lack what VFW uses); NeoForge explains the problem instead of crashing.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[${jei_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[${jade_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mysticalagriculture"
    type="optional"
    versionRange="[${mystical_agriculture_mod_version},)"
    ordering="NONE"
    side="BOTH"
