# Virtual Farm Works — build properties: Gradle settings, Minecraft/NeoForge versions, optional integration versions
# and mod metadata. Values here are expanded into neoforge.mods.toml (see generateModMetadata in build.gradle).

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.251
# The FML version range the mod file asks for. FML 4 (NeoForge 21.1) requires it in neoforge.mods.toml; later FML
# versions made it optional.
loader_version_range=[4,)

## Optional integrations (compile-only; never bundled, never required at runtime)
# The 1.21.1 line pins the versions All the Mods 10 ships (docs/port-1.21.1.md keeps the table; the dev copies in
# run/mods are the same jars).
# Mystical Agriculture, from https://maven.blakesmods.com
mystical_agriculture_version=1.21.1-8.0.28
# JEI, from https://maven.blamejared.com
jei_version=19.57.0.446
# Jade, from the Modrinth maven (version number as published on Modrinth)
jade_version=15.10.6+neoforge

## Test-only dependencies
junit_version=5.13.4

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=virtualfarmworks
# The human-readable display name for the mod.
mod_name=Virtual Farm Works
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/ The release file is named virtualfarmworks-<minecraft_version>-<mod_version>.jar
# (see build.gradle); neoforge.mods.toml gets the mod version alone.
mod_version=1.0.1
# Shown in the mods list. The mod is presented as Redkeep's (owner, 2026-09-30).
mod_authors=Redkeep
# Home page and issue tracker, shown in the mods list and on crash screens (empty = left out of the metadata).
# Redkeep's GitHub account is "redkeepp" ("redkeep" was taken); switch to the CurseForge/Modrinth page once it exists.
mod_url=https://github.com/redkeepp/virtual-farm-works
mod_issues_url=https://github.com/redkeepp/virtual-farm-works/issues
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.virtualfarmworks
