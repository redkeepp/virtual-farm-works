// Virtual Farm Works — Gradle build (NeoForge ModDevGradle). Defines the dev run configurations (client, server,
// gameTestServer, benchmark, data), the gametest source set (dev only, never in the release jar), compile-only optional
// integrations (Mystical Agriculture, JEI, Jade), test dependencies (JUnit), the mod metadata expansion and what the
// release jar holds. Based on the official NeoForge 26.1.2 MDK; MDK comments are kept below where still useful.
// This is the 1.21.1 line (branch 1.21.1, NeoForge 21.1): same build as main, with the 1.21.1 toolchain, data run and
// versions (gradle.properties; docs/port-1.21.1.md).
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// Release file name: virtualfarmworks-<Minecraft version>-<mod version>.jar, like large mods (Mystical Agriculture:
// 1.21.1-8.0.28). The mod version alone goes into neoforge.mods.toml.
version = "${minecraft_version}-${mod_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
    // The owner's old textures ("antigos, nao usar" = old, do not use): kept in the repository, never shipped
    exclude("**/antigos_nao_usar/**")
}

// Game tests and the load benchmark (src/gametest): their own source set, so they never go into the release jar. In dev
// runs it is part of the mod (mods block below) and registers the tests itself (gametest/GameTestsEntry, a @Mod class).
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    // The optional integrations' APIs, compile only as for main (the tests exercise Mystical Agriculture).
    gametestCompileOnly.extendsFrom compileOnly
}

repositories {
    // Official BlakeBr0 maven (Mystical Agriculture, Cucumber, Mystical Agradditions).
    maven {
        name = "BlakeBr0"
        url = "https://maven.blakesmods.com"
        content { includeGroupByRegex "com\\.blakebr0.*" }
    }
    // Official JEI maven.
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
    // Modrinth maven (Jade publishes there).
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods must target Java 21 (a newer class file would not load).
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Minecraft and NeoForge on the gametest source set's classpaths too.
    addModdingDependenciesTo(sourceSets.gametest)

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // VFW: runs in its OWN folder, run-gametest/, not run/. The tests need the default config, while run/config
        // holds the owner's manual test values (e.g. an overclock), and the tests must never rewrite the owner's
        // files. The owner's test mods are copied from run/mods before each run (syncTestMods below).
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // VFW load benchmark (`gradlew runBenchmark`): the same headless game test server and folder, but it registers
        // only the benchmark (gametest/LoadBenchmark), which writes a cost table to the log and to
        // run-gametest/vfw-benchmark.txt.
        benchmark {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'virtualfarmworks.benchmark', 'true'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest) // dev runs only: the release jar is built from main alone
        }
    }
}

// The game tests and the benchmark use run-gametest/ (see the runs above). Copy the owner's test mods (Mystical
// Agriculture, Agradditions, Jade, JEI...) from run/mods into it before every run; Sync also removes jars the owner
// deleted from run/mods. Only the mods are shared: config, worlds and logs stay separate.
var syncTestMods = tasks.register('syncTestMods', Sync) {
    from 'run/mods'
    into 'run-gametest/mods'
}
tasks.matching { it.name == 'runGameTestServer' || it.name == 'runBenchmark' }.configureEach {
    dependsOn syncTestMods
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Mystical Agriculture: COMPILE ONLY. VFW must run without MA installed; every class that touches MA types lives
    // in com.virtualfarmworks.compat.mysticalagriculture and is only loaded when MA is present (see MysticalCompat).
    // transitive = false: we only need MA's API classes, not its whole dependency tree.
    compileOnly("com.blakebr0.mysticalagriculture:MysticalAgriculture:${mystical_agriculture_version}") {
        transitive = false
    }

    // JEI and Jade: COMPILE ONLY, same rule as Mystical Agriculture. Their plugin classes are discovered by JEI/Jade
    // themselves (annotations) and are never loaded when those mods are absent. EMI: deferred by the owner.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Plain JUnit for the Minecraft-free simulation core (com.virtualfarmworks.sim). Game-dependent behavior is
    // covered by game tests instead (gradlew runGameTestServer).
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_url                : mod_url,
            mod_issues_url         : mod_issues_url,
            // Minimum versions of the optional integrations: the ones VFW is built against.
            jei_version            : jei_version,
            jade_version           : jade_version,
            // Its maven version is 1.21.1-8.0.28; the mod itself declares 8.0.28.
            mystical_agriculture_mod_version: mystical_agriculture_version.substring(
                    mystical_agriculture_version.lastIndexOf('-') + 1),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// `gradlew build` (CI) also compiles the game tests, so a change that breaks them is caught without running them.
tasks.named('check').configure {
    dependsOn tasks.named('gametestClasses')
}

// The MIT license asks for its notice in every copy: the jar carries it, under a name no other mod's LICENSE can
// clash with in a merged or nested jar.
var licenseInJar = "LICENSE_${mod_id}" // a plain value: the rename runs at execution time (configuration cache)
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { licenseInJar }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
