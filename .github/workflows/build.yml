# CI for Virtual Farm Works: on every push / pull request, builds the mod on Linux with the branch's JDK (21 on the
# 1.21.1 branch, 25 on main), runs the JUnit tests (`gradlew build` includes `test`) and compiles the game tests. The
# game tests themselves (runGameTestServer) are not run here: they need the optional mods in run/mods, which are not
# in the repository.
# Note: gradlew must keep its executable bit in git (git update-index --chmod=+x gradlew), otherwise this job fails
# with "Permission denied" — easy to lose when the repo is managed from Windows.
name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build